name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Require 90 percent statement coverage
        run: |
          go tool cover -func=coverage.out
          go tool cover -func=coverage.out | awk '/^total:/ { found=1; if ($3+0 < 90) exit 1 } END { if (!found) exit 1 }'
